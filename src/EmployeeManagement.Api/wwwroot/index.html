<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e3e6ec; --primary:#2563eb; --danger:#dc2626; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .tabs { display:flex; gap:4px; margin-bottom:16px; }
  .tabs button { background:none; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--muted); }
  .tabs button.active { background:var(--primary); color:#fff; }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { cursor:pointer; }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  button.danger { color:var(--danger); }
  button.link { border:0; background:none; color:var(--primary); padding:2px 6px; }
  button.link.danger { color:var(--danger); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .toolbar .spacer { flex:1; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase; cursor:default; }
  th.sortable { cursor:pointer; user-select:none; }
  td.num, th.num { text-align:right; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .badge.on { background:#dcfce7; color:var(--ok); } .badge.off { background:#f3f4f6; color:var(--muted); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; color:var(--muted); }
  .login { max-width:340px; margin:80px auto; }
  .login label, .form label { display:block; margin-bottom:10px; font-weight:500; }
  .login input, .form input, .form select { width:100%; margin-top:4px; }
  .hint { color:var(--muted); font-size:12px; margin-top:12px; }
  .error { background:#fee2e2; color:#991b1b; padding:8px 12px; border-radius:6px; margin-bottom:12px; white-space:pre-line; }
  .toast { position:fixed; bottom:20px; right:20px; background:#111827; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  dialog { border:1px solid var(--line); border-radius:10px; padding:20px; width:min(440px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<section id="loginView" class="card login" hidden>
  <h2 style="margin-top:0">Sign in</h2>
  <div id="loginError" class="error" hidden></div>
  <form id="loginForm">
    <label>Username <input id="username" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" style="width:100%">Sign in</button>
  </form>
  <p class="hint">Development logins: <b>admin</b> / Admin@12345 (full access) &middot; <b>user</b> / User@12345 (read-only).</p>
</section>

<div id="appView" hidden>
  <header>
    <h1>Employee Management</h1>
    <span id="whoami" class="hint" style="margin:0"></span>
    <button id="logoutBtn">Sign out</button>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="employees" class="active">Employees</button>
      <button data-tab="departments">Departments</button>
      <button data-tab="summary">Summary</button>
    </div>

    <section id="tab-employees" class="card">
      <div class="toolbar">
        <input id="search" placeholder="Search name or email…" style="min-width:220px">
        <select id="deptFilter"><option value="">All departments</option></select>
        <select id="activeFilter">
          <option value="">Any status</option><option value="true">Active</option><option value="false">Inactive</option>
        </select>
        <span class="spacer"></span>
        <button class="primary admin-only" id="addEmployeeBtn">+ Add employee</button>
      </div>
      <div id="empError" class="error" hidden></div>
      <table>
        <thead><tr id="empHead"></tr></thead>
        <tbody id="empBody"></tbody>
      </table>
      <div class="pager">
        <span id="pageInfo"></span>
        <button id="prevBtn">Prev</button><button id="nextBtn">Next</button>
      </div>
    </section>

    <section id="tab-departments" class="card" hidden>
      <div class="toolbar">
        <span class="spacer"></span>
        <button class="primary admin-only" id="addDeptBtn">+ Add department</button>
      </div>
      <div id="deptError" class="error" hidden></div>
      <table>
        <thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
        <tbody id="deptBody"></tbody>
      </table>
    </section>

    <section id="tab-summary" class="card" hidden>
      <table>
        <thead><tr><th>Department</th><th class="num">Employees</th><th class="num">Average salary</th></tr></thead>
        <tbody id="sumBody"></tbody>
      </table>
    </section>
  </main>
</div>

<dialog id="empDialog">
  <form id="empForm" class="form" method="dialog">
    <h3 id="empDialogTitle" style="margin-top:0"></h3>
    <div id="empFormError" class="error" hidden></div>
    <div class="row2">
      <label>First name <input name="firstName" maxlength="50" required></label>
      <label>Last name <input name="lastName" maxlength="50" required></label>
    </div>
    <label>Email <input name="email" type="email" maxlength="150" required></label>
    <div class="row2">
      <label>Hire date <input name="hireDate" type="date" required></label>
      <label>Salary <input name="salary" type="number" step="0.01" min="0.01" required></label>
    </div>
    <label>Department <select name="departmentId" required></select></label>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>

<dialog id="deptDialog">
  <form id="deptForm" class="form" method="dialog">
    <h3 id="deptDialogTitle" style="margin-top:0"></h3>
    <div id="deptFormError" class="error" hidden></div>
    <label>Name <input name="name" minlength="2" maxlength="100" required></label>
    <label>Description <input name="description" maxlength="500"></label>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString(undefined, { style: 'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2 });

const state = { token: null, role: null, user: null, departments: [], page: 1, pageSize: 10, sortBy: 'lastName', desc: false, totalPages: 1 };
const isAdmin = () => state.role === 'Admin';

// ---------- API ----------
class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { ...(body !== undefined && { 'Content-Type': 'application/json' }), ...(state.token && { Authorization: 'Bearer ' + state.token }) },
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if (res.status === 401 && state.token) { logout(); throw new ApiError(401, 'Session expired. Please sign in again.'); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new ApiError(res.status, problemText(res.status, data));
  return data;
}

function problemText(status, p) {
  if (status === 403) return 'You do not have permission to do that (admin only).';
  if (p?.errors) return Object.values(p.errors).flat().join('\n');
  return p?.detail || p?.title || `Request failed (${status}).`;
}

function showError(el, err) { el.textContent = err.message; el.hidden = false; }
function clearError(el) { el.hidden = true; el.textContent = ''; }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }

// ---------- Auth ----------
function applyAuth() {
  const on = !!state.token;
  $('#loginView').hidden = on; $('#appView').hidden = !on;
  if (!on) return;
  $('#whoami').textContent = `${state.user} (${state.role})`;
  document.querySelectorAll('.admin-only').forEach(e => e.hidden = !isAdmin());
  $('#activeFilter').hidden = !isAdmin(); // only admins can see inactive employees
}

function logout() {
  state.token = state.role = state.user = null;
  Object.assign(state, { departments: [], employees: {}, page: 1, sortBy: 'lastName', desc: false, totalPages: 1 });
  sessionStorage.removeItem('auth');
  // Wipe everything the previous user could see, so the next login never shows stale rows or filters.
  ['#empBody', '#deptBody', '#sumBody'].forEach(s => $(s).innerHTML = '');
  $('#search').value = ''; $('#activeFilter').value = '';
  $('#deptFilter').innerHTML = '<option value="">All departments</option>';
  document.querySelectorAll('.tabs button')[0].click();
  applyAuth();
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); clearError($('#loginError'));
  try {
    const r = await api('POST', '/api/auth/login', { username: $('#username').value, password: $('#password').value });
    Object.assign(state, { token: r.accessToken, role: r.role, user: r.username });
    sessionStorage.setItem('auth', JSON.stringify({ token: r.accessToken, role: r.role, user: r.username, exp: r.expiresAtUtc }));
    $('#password').value = '';
    await start();
  } catch (err) { showError($('#loginError'), err); }
});
$('#logoutBtn').addEventListener('click', logout);

// ---------- Tabs ----------
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  ['employees', 'departments', 'summary'].forEach(t => $('#tab-' + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'departments') loadDepartments();
  if (b.dataset.tab === 'summary') loadSummary();
}));

// ---------- Employees ----------
const columns = [
  ['lastName', 'Name'], ['email', 'Email'], [null, 'Department'],
  ['hireDate', 'Hired'], [null, 'Salary', 'num'], [null, 'Status'], [null, '']
];

function renderHead() {
  $('#empHead').innerHTML = columns.map(([key, label, cls]) => {
    const arrow = key && state.sortBy === key ? (state.desc ? ' ▼' : ' ▲') : '';
    return `<th class="${key ? 'sortable' : ''} ${cls || ''}" ${key ? `data-sort="${key}"` : ''}>${label}${arrow}</th>`;
  }).join('');
}
$('#empHead').addEventListener('click', e => {
  const k = e.target.closest('[data-sort]')?.dataset.sort; if (!k) return;
  state.desc = state.sortBy === k ? !state.desc : false; state.sortBy = k; state.page = 1; loadEmployees();
});

async function loadEmployees() {
  clearError($('#empError')); renderHead();
  const q = new URLSearchParams({ page: state.page, pageSize: state.pageSize, sortBy: state.sortBy, descending: state.desc });
  if ($('#search').value.trim()) q.set('search', $('#search').value.trim());
  if ($('#deptFilter').value) q.set('departmentId', $('#deptFilter').value);
  if ($('#activeFilter').value) q.set('isActive', $('#activeFilter').value);
  try {
    const r = await api('GET', '/api/employees?' + q);
    state.totalPages = Math.max(r.totalPages, 1);
    $('#empBody').innerHTML = r.items.map(e => `
      <tr>
        <td>${esc(e.fullName)}</td><td>${esc(e.email)}</td><td>${esc(e.departmentName)}</td>
        <td>${esc(e.hireDate)}</td><td class="num">${money(e.salary)}</td>
        <td><span class="badge ${e.isActive ? 'on' : 'off'}">${e.isActive ? 'Active' : 'Inactive'}</span></td>
        <td class="admin-only" ${isAdmin() ? '' : 'hidden'}>
          <button class="link" data-act="edit" data-id="${e.id}">Edit</button>
          <button class="link" data-act="toggle" data-id="${e.id}" data-active="${e.isActive}">${e.isActive ? 'Deactivate' : 'Activate'}</button>
          <button class="link danger" data-act="delete" data-id="${e.id}">Delete</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="7" class="hint">No employees found.</td></tr>`;
    state.employees = Object.fromEntries(r.items.map(e => [e.id, e]));
    $('#pageInfo').textContent = `Page ${r.page} of ${state.totalPages} · ${r.totalCount} total`;
    $('#prevBtn').disabled = state.page <= 1; $('#nextBtn').disabled = state.page >= state.totalPages;
    document.querySelectorAll('#empHead th:last-child').forEach(th => th.hidden = !isAdmin());
  } catch (err) { showError($('#empError'), err); }
}

let searchTimer;
$('#search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.page = 1; loadEmployees(); }, 300); });
['deptFilter', 'activeFilter'].forEach(id => $('#' + id).addEventListener('change', () => { state.page = 1; loadEmployees(); }));
$('#prevBtn').addEventListener('click', () => { state.page--; loadEmployees(); });
$('#nextBtn').addEventListener('click', () => { state.page++; loadEmployees(); });

$('#empBody').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = Number(b.dataset.id);
  try {
    if (b.dataset.act === 'edit') openEmpDialog(state.employees[id]);
    else if (b.dataset.act === 'toggle') { await api('PATCH', `/api/employees/${id}/status`, { isActive: b.dataset.active !== 'true' }); toast('Status updated'); loadEmployees(); }
    else if (b.dataset.act === 'delete' && confirm('Delete this employee?')) { await api('DELETE', `/api/employees/${id}`); toast('Employee deleted'); loadEmployees(); }
  } catch (err) { showError($('#empError'), err); }
});

// Employee dialog
let editingEmpId = null;
function fillDeptSelect(sel, withAll) {
  const opts = state.departments.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  sel.innerHTML = (withAll ? '<option value="">All departments</option>' : '') + opts;
}
function openEmpDialog(emp) {
  editingEmpId = emp?.id ?? null;
  const f = $('#empForm'); f.reset(); clearError($('#empFormError'));
  fillDeptSelect(f.departmentId);
  $('#empDialogTitle').textContent = emp ? 'Edit employee' : 'Add employee';
  if (emp) { f.firstName.value = emp.firstName; f.lastName.value = emp.lastName; f.email.value = emp.email; f.hireDate.value = emp.hireDate; f.salary.value = emp.salary; f.departmentId.value = emp.departmentId; }
  $('#empDialog').showModal();
}
$('#addEmployeeBtn').addEventListener('click', () => openEmpDialog(null));
$('#empForm').addEventListener('submit', async e => {
  e.preventDefault(); clearError($('#empFormError'));
  const f = e.target;
  const body = { firstName: f.firstName.value.trim(), lastName: f.lastName.value.trim(), email: f.email.value.trim(), hireDate: f.hireDate.value, salary: Number(f.salary.value), departmentId: Number(f.departmentId.value) };
  try {
    if (editingEmpId) await api('PUT', `/api/employees/${editingEmpId}`, body); else await api('POST', '/api/employees', body);
    $('#empDialog').close(); toast('Employee saved'); loadEmployees();
  } catch (err) { showError($('#empFormError'), err); }
});

// ---------- Departments ----------
async function loadDepartments() {
  clearError($('#deptError'));
  try {
    state.departments = await api('GET', '/api/departments');
    $('#deptBody').innerHTML = state.departments.map(d => `
      <tr><td>${esc(d.name)}</td><td>${esc(d.description)}</td>
        <td class="admin-only" ${isAdmin() ? '' : 'hidden'}>
          <button class="link" data-act="edit" data-id="${d.id}">Edit</button>
          <button class="link danger" data-act="delete" data-id="${d.id}">Delete</button>
        </td></tr>`).join('') || `<tr><td colspan="3" class="hint">No departments.</td></tr>`;
    const cur = $('#deptFilter').value;
    fillDeptSelect($('#deptFilter'), true); $('#deptFilter').value = cur;
  } catch (err) { showError($('#deptError'), err); }
}

$('#deptBody').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = Number(b.dataset.id);
  try {
    if (b.dataset.act === 'edit') openDeptDialog(state.departments.find(d => d.id === id));
    else if (confirm('Delete this department?')) { await api('DELETE', `/api/departments/${id}`); toast('Department deleted'); loadDepartments(); }
  } catch (err) { showError($('#deptError'), err); }
});

let editingDeptId = null;
function openDeptDialog(d) {
  editingDeptId = d?.id ?? null;
  const f = $('#deptForm'); f.reset(); clearError($('#deptFormError'));
  $('#deptDialogTitle').textContent = d ? 'Edit department' : 'Add department';
  if (d) { f.name.value = d.name; f.description.value = d.description ?? ''; }
  $('#deptDialog').showModal();
}
$('#addDeptBtn').addEventListener('click', () => openDeptDialog(null));
$('#deptForm').addEventListener('submit', async e => {
  e.preventDefault(); clearError($('#deptFormError'));
  const f = e.target; const body = { name: f.name.value.trim(), description: f.description.value.trim() || null };
  try {
    if (editingDeptId) await api('PUT', `/api/departments/${editingDeptId}`, body); else await api('POST', '/api/departments', body);
    $('#deptDialog').close(); toast('Department saved'); loadDepartments();
  } catch (err) { showError($('#deptFormError'), err); }
});

// ---------- Summary ----------
async function loadSummary() {
  try {
    const rows = await api('GET', '/api/departments/summary');
    $('#sumBody').innerHTML = rows.map(r => `<tr><td>${esc(r.departmentName)}</td><td class="num">${r.employeeCount}</td><td class="num">${money(r.averageSalary)}</td></tr>`).join('')
      || `<tr><td colspan="3" class="hint">No data.</td></tr>`;
  } catch (err) { $('#sumBody').innerHTML = `<tr><td colspan="3"><div class="error">${esc(err.message)}</div></td></tr>`; }
}

// ---------- Dialog close buttons ----------
document.querySelectorAll('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

// ---------- Boot ----------
async function start() {
  applyAuth();
  await loadDepartments();
  await loadEmployees();
}
try {
  const saved = JSON.parse(sessionStorage.getItem('auth') || 'null');
  if (saved && new Date(saved.exp) > new Date()) Object.assign(state, { token: saved.token, role: saved.role, user: saved.user });
} catch { /* ignore corrupt storage */ }
state.token ? start() : applyAuth();
</script>
</body>
</html>
